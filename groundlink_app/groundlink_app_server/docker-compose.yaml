services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: groundlink_app
      POSTGRES_PASSWORD: "57gAJxx3Oq9Z0oGJlQAEZNZy2igcQdzD"
    volumes:
      - groundlink_app_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "R9Og3GQk_9M8r6mUA9_0BjsloXyybS6b"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: groundlink_app_test
      POSTGRES_PASSWORD: "EssCW37M3BDZiiIyELRlgeHFRtE0t3nO"
    volumes:
      - groundlink_app_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "gRCE-tFFSETF_EYoeqyENZry0kVnNBt_"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  groundlink_app_data:
  groundlink_app_test_data:
